name: publicar

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: contexto (medida)
        run: |
          echo "MEDIDA event=$GITHUB_EVENT_NAME ref=$GITHUB_REF ref_name=$GITHUB_REF_NAME ref_type=$GITHUB_REF_TYPE sha=$GITHUB_SHA head=${{ github.event.pull_request.head.sha }}"
          echo "MEDIDA head_commit=$(git rev-parse HEAD)"

      - name: Nome e versão
        id: img
        run: |
          echo "nome=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            echo "versao=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "versao=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.img.outputs.nome }}:${{ steps.img.outputs.versao }}
          build-args: |
            VERSAO=${{ steps.img.outputs.versao }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
